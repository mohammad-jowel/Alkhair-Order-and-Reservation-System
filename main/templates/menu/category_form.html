{% extends 'base.html' %}

{% block title %}{{ title }} - Restoran Alkhair{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom">
                <h5 class="fw-bold mb-0"><i class="bi bi-folder-check text-primary me-2"></i>{{ title }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mb-4">
                        <label for="{{ form.category_name.id_for_label }}" class="form-label fw-semibold">Category Name</label>
                        {{ form.category_name }}
                        {% if form.category_name.errors %}
                            <div class="text-danger small mt-1">{{ form.category_name.errors.0 }}</div>
                        {% endif %}
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'menu:manage_menu' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check2 me-1"></i> Save Category
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
