{% extends 'base.html' %}

{% block title %}Access Denied - Restoran Alkhair{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-8 col-lg-6">
        <div class="card p-5 shadow-sm border-0">
            <div class="display-1 text-danger fw-bold mb-3">403</div>
            <h1 class="h3 fw-bold mb-3">Access Denied</h1>
            <p class="text-muted mb-4">
                You do not have permission to view this page or perform this action. Administrator privileges or proper account ownership is required.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'core:home' %}" class="btn btn-primary">
                    <i class="bi bi-house-door me-1"></i> Return Home
                </a>
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
