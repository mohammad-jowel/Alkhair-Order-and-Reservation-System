{% extends 'base.html' %}

{% block title %}Page Not Found - Restoran Alkhair{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-8 col-lg-6">
        <div class="card p-5 shadow-sm border-0" style="border-radius: var(--radius-xl);">
            <div class="display-1 text-primary fw-bold mb-3">404</div>
            <h1 class="h3 fw-bold mb-3">Page Not Found</h1>
            <p class="text-muted mb-4">
                The page or record you are looking for does not exist or has been moved.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'core:home' %}" class="btn btn-primary">
                    <i class="bi bi-house-door me-1"></i> Return Home
                </a>
                <a href="{% url 'menu:menu_list' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-journal-text me-1"></i> Browse Menu
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
